name: ARM64 concurrency

on:
  # 仅手动触发：公共 ARM64 runner 队列不稳定，不作为 push 门禁。
  workflow_dispatch:
    inputs:
      soak_seconds:
        description: 'MPSC soak duration in seconds (0 disables soak)'
        required: false
        default: '30'
        type: string

permissions:
  contents: read

jobs:
  standalone-tests:
    name: ARM64 Linux standalone concurrency tests
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report runner CPU topology
        run: |
          uname -m
          nproc
          lscpu

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DKAIRO_BUILD_TESTS=ON \
            -DKAIRO_BUILD_EXAMPLES=OFF \
            -DKAIRO_ENABLE_GPU=OFF \
            -DKAIRO_ENABLE_CUDA=OFF \
            -DKAIRO_ENABLE_OPENCL=OFF

      - name: Build standalone tests
        run: |
          cmake --build build --target \
            android_smoke \
            test_stop_token_compat \
            test_executor_manager_android_defaults \
            test_android_lockfree_queue_core \
            test_multithread_mpsc \
            test_lockfree_worker_queue_concurrent_steal

      - name: Run standalone tests
        working-directory: build
        env:
          KAIRO_ANDROID_SOAK_SECONDS: ${{ github.event.inputs.soak_seconds || '30' }}
        run: |
          ctest --output-on-failure -R \
            '^(android_smoke|test_stop_token_compat|test_executor_manager_android_defaults|test_android_lockfree_queue_core|test_multithread_mpsc|test_lockfree_worker_queue_concurrent_steal)$'

      - name: Rerun lockfree tests pinned to one core
        working-directory: build
        run: |
          taskset -c 0 ctest --output-on-failure -R \
            '^(test_android_lockfree_queue_core|test_multithread_mpsc|test_lockfree_worker_queue_concurrent_steal)$'

  asan-ubsan:
    name: ARM64 Linux ASan/UBSan lockfree tests
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure sanitizers
        run: |
          cmake -S . -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DKAIRO_BUILD_TESTS=ON \
            -DKAIRO_BUILD_EXAMPLES=OFF \
            -DKAIRO_ENABLE_GPU=OFF \
            -DKAIRO_ENABLE_CUDA=OFF \
            -DKAIRO_ENABLE_OPENCL=OFF

      - name: Build sanitizer lockfree tests
        run: |
          cmake --build build-asan --target \
            test_android_lockfree_queue_core \
            test_multithread_mpsc \
            test_lockfree_worker_queue_concurrent_steal

      - name: Run sanitizer lockfree tests
        working-directory: build-asan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ctest --output-on-failure -R \
            '^(test_android_lockfree_queue_core|test_multithread_mpsc|test_lockfree_worker_queue_concurrent_steal)$'
