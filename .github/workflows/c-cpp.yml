name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
  schedule:
    # Nightly focused concurrency coverage. Regular PR gating also runs
    # build-and-test, TSAN, and the lockfree worker queue functional suite.
    - cron: '0 19 * * *'

jobs:
  build-and-test:
    if: github.event_name != 'schedule'
    name: ${{ matrix.os }} - ${{ matrix.compiler.name }} ${{ matrix.compiler.version }} - ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        # GitHub-hosted ARM64 runner is currently long queued/unavailable for this repo,
        # so it is temporarily disabled; it can be restored later with self-hosted ARM64
        # or a manual workflow.
        os: [ubuntu-22.04, windows-latest]
        build_type: [Release, Debug]
        compiler:
          - { name: gcc, version: 11 }
          - { name: clang, version: 14 }
        exclude:
          # Windows 只用 MSVC
          - os: windows-latest
            compiler: { name: gcc }
          - os: windows-latest
            compiler: { name: clang }
        include:
          - os: windows-latest
            build_type: Release
            compiler: { name: msvc, version: '' }
          - os: windows-latest
            build_type: Debug
            compiler: { name: msvc, version: '' }

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装依赖 (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        # GitHub runner 的 azure.archive.ubuntu.com 主镜像偶发不可达，且 apt 的
        # mirror 探测重试不受 Acquire::Retries 约束；固定镜像并限制超时与重试。
        APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
        # azure 主镜像被黑洞时，apt mirror 方法的探测重试不受上面的 Acquire 选项约束，
        # 直接固定镜像列表为 archive.ubuntu.com，跳过对 azure 镜像的探测。
        echo "https://archive.ubuntu.com/ubuntu" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
        sudo sed -i 's#http://azure\.archive\.ubuntu\.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list || true
        sudo apt-get update $APT_OPTS
        # libgtest-dev 必须安装：缺失时 CMake 会跳过全部 GTest 测试，
        # 主门禁就只剩 6 个 standalone 测试，覆盖范围与绿灯结论严重不符。
        sudo apt-get install -y $APT_OPTS cmake ninja-build libgtest-dev
        if [ "${{ matrix.compiler.name }}" = "gcc" ]; then
          sudo apt-get install -y $APT_OPTS g++-${{ matrix.compiler.version }}
          echo "CC=gcc-${{ matrix.compiler.version }}" >> $GITHUB_ENV
          echo "CXX=g++-${{ matrix.compiler.version }}" >> $GITHUB_ENV
        else
          sudo apt-get install -y $APT_OPTS clang-${{ matrix.compiler.version }}
          echo "CC=clang-${{ matrix.compiler.version }}" >> $GITHUB_ENV
          echo "CXX=clang++-${{ matrix.compiler.version }}" >> $GITHUB_ENV
        fi

    - name: 配置 CMake (Linux)
      if: runner.os == 'Linux'
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DKAIRO_BUILD_TESTS=ON \
          -DKAIRO_BUILD_EXAMPLES=ON \
          -DKAIRO_ENABLE_COVERAGE=OFF

    - name: 配置 CMake (Windows)
      if: runner.os == 'Windows'
      run: |
        cmake -B build `
          -DKAIRO_BUILD_TESTS=ON `
          -DKAIRO_BUILD_EXAMPLES=ON `
          -DKAIRO_ENABLE_COVERAGE=OFF `
          -DKAIRO_FETCH_GTEST=ON

    - name: 编译
      run: cmake --build build --config ${{ matrix.build_type }} -j

    - name: 校验注册测试数量
      # 防回归：GTest 缺失时 CMake 会静默跳过约 120 个测试，只剩 6 个
      # standalone 测试且仍然全绿。断言注册数量下限，让这种退化显式失败。
      working-directory: build
      shell: bash
      run: |
        COUNT=$(ctest -N -C ${{ matrix.build_type }} | grep -oE 'Total Tests: [0-9]+' | grep -oE '[0-9]+')
        echo "Registered tests: ${COUNT}"
        if [ "${COUNT}" -lt 90 ]; then
          echo "::error::Only ${COUNT} tests registered - GTest-based tests were likely skipped (missing GTest?)."
          exit 1
        fi

    - name: 运行测试
      working-directory: build
      # 与 lockfree 专项任务同一策略：2-vCPU runner 上 benchmark/stress 的
      # 时延断言噪声过大，不适合作为主门禁的 pass/fail 信号，按名排除。
      run: ctest -C ${{ matrix.build_type }} -E "^benchmark_|^test_(performance|stress)$" --output-on-failure --verbose

    - name: 上传构建产物 (Release)
      if: matrix.build_type == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: kairo-${{ matrix.os }}-${{ matrix.compiler.name }}-${{ matrix.compiler.version }}
        path: |
          build/lib*
          build/tests/test_*
        retention-days: 7

  lockfree-queue:
    # LockfreeWorkerQueue path is exercised as focused functional coverage.
    # Benchmarks and stress tests are intentionally excluded by name below:
    # on 2-vCPU GitHub runners they are too noisy to be reliable pass/fail
    # signals for the lockfree queue implementation.
    name: Lockfree worker queue - gcc 11 Release
    runs-on: ubuntu-22.04

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装依赖
      run: |
        # 同上：固定镜像为 archive.ubuntu.com，并限制 apt 超时与重试。
        APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
        # azure 主镜像被黑洞时，apt mirror 方法的探测重试不受上面的 Acquire 选项约束，
        # 直接固定镜像列表为 archive.ubuntu.com，跳过对 azure 镜像的探测。
        echo "https://archive.ubuntu.com/ubuntu" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
        sudo sed -i 's#http://azure\.archive\.ubuntu\.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list || true
        sudo apt-get update $APT_OPTS
        sudo apt-get install -y $APT_OPTS cmake ninja-build g++-11 libgtest-dev

    - name: 配置 CMake (Lockfree queue)
      run: |
        cmake -B build-lockfree -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_COMPILER=g++-11 \
          -DKAIRO_BUILD_TESTS=ON \
          -DKAIRO_BUILD_EXAMPLES=OFF \
          -DKAIRO_ENABLE_GPU=OFF \
          -DKAIRO_ENABLE_COVERAGE=OFF \
          -DKAIRO_LOCKFREE_QUEUE=ON

    - name: 编译
      run: cmake --build build-lockfree --config Release -j

    - name: 运行测试
      working-directory: build-lockfree
      run: ctest -C Release --output-on-failure --verbose -E '^(benchmark_|test_(performance|stress)$)'

  thread-sanitizer:
    name: ThreadSanitizer concurrency tests - gcc 11 Release
    runs-on: ubuntu-22.04

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装依赖
      run: |
        # 同上：固定镜像为 archive.ubuntu.com，并限制 apt 超时与重试。
        APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
        # azure 主镜像被黑洞时，apt mirror 方法的探测重试不受上面的 Acquire 选项约束，
        # 直接固定镜像列表为 archive.ubuntu.com，跳过对 azure 镜像的探测。
        echo "https://archive.ubuntu.com/ubuntu" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
        sudo sed -i 's#http://azure\.archive\.ubuntu\.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list || true
        sudo apt-get update $APT_OPTS
        sudo apt-get install -y $APT_OPTS cmake ninja-build g++-11 libgtest-dev

    - name: 配置 CMake (TSAN)
      run: |
        cmake -B build-tsan -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_COMPILER=g++-11 \
          -DKAIRO_BUILD_TESTS=ON \
          -DKAIRO_BUILD_EXAMPLES=OFF \
          -DKAIRO_ENABLE_GPU=OFF \
          -DKAIRO_ENABLE_COVERAGE=OFF \
          -DKAIRO_ENABLE_TSAN=ON

    - name: 编译 TSAN 并发测试
      run: |
        cmake --build build-tsan --config Release -j --target \
          test_comm_channel \
          test_comm_double_buffer \
          test_comm_mailbox \
          test_comm_phase_gate \
          test_comm_topic \
          test_thread_pool \
          test_thread_pool_resize_uaf \
          test_thread_pool_resize_status \
          test_dispatcher_resize_under_load \
          test_concurrent_stop_submit \
          test_self_stop_handoff \
          test_shutdown_drain_reentrancy \
          test_timer_handle \
          test_timer_thread_lifecycle_race \
          test_lockfree_task_executor \
          test_lockfree_mpsc \
          test_batch_integration \
          test_executor_manager

    - name: 运行 TSAN 并发测试
      working-directory: build-tsan
      env:
        TSAN_OPTIONS: halt_on_error=1 history_size=7 second_deadlock_stack=1
      run: |
        ctest -C Release --output-on-failure --verbose \
          -R '^(test_comm_channel|test_comm_double_buffer|test_comm_mailbox|test_comm_phase_gate|test_comm_topic|test_thread_pool|test_thread_pool_resize_uaf|test_thread_pool_resize_status|test_dispatcher_resize_under_load|test_concurrent_stop_submit|test_self_stop_handoff|test_shutdown_drain_reentrancy|test_timer_handle|test_timer_thread_lifecycle_race|test_lockfree_task_executor|test_lockfree_mpsc|test_batch_integration|test_executor_manager)$'

  realtime-allocation-guard:
    name: Realtime communication allocation guard - gcc 11 Release
    runs-on: ubuntu-22.04

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装依赖
      run: |
        # 同上：固定镜像为 archive.ubuntu.com，并限制 apt 超时与重试。
        APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
        # azure 主镜像被黑洞时，apt mirror 方法的探测重试不受上面的 Acquire 选项约束，
        # 直接固定镜像列表为 archive.ubuntu.com，跳过对 azure 镜像的探测。
        echo "https://archive.ubuntu.com/ubuntu" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
        sudo sed -i 's#http://azure\.archive\.ubuntu\.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list || true
        sudo apt-get update $APT_OPTS
        sudo apt-get install -y $APT_OPTS cmake ninja-build g++-11 libgtest-dev

    - name: 配置 CMake (Realtime allocation guard)
      run: |
        cmake -B build-realtime-allocation -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_COMPILER=g++-11 \
          -DKAIRO_BUILD_TESTS=ON \
          -DKAIRO_BUILD_EXAMPLES=OFF \
          -DKAIRO_ENABLE_GPU=OFF \
          -DKAIRO_ENABLE_COVERAGE=OFF \
          -DKAIRO_ENABLE_REALTIME_ALLOCATION_GUARD=ON

    - name: 编译实时分配测试
      run: |
        cmake --build build-realtime-allocation --config Release -j --target \
          test_comm_realtime_memory

    - name: 运行实时分配测试
      working-directory: build-realtime-allocation
      run: |
        ctest -C Release --output-on-failure --verbose \
          -R '^test_comm_realtime_memory$'

  gpu-headers-build:
    if: github.event_name != 'schedule'
    name: GPU headers compile paths
    runs-on: ubuntu-22.04

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装 GPU 头文件构建依赖
      run: |
        # 同上：固定镜像为 archive.ubuntu.com，并限制 apt 超时与重试。
        APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
        # azure 主镜像被黑洞时，apt mirror 方法的探测重试不受上面的 Acquire 选项约束，
        # 直接固定镜像列表为 archive.ubuntu.com，跳过对 azure 镜像的探测。
        echo "https://archive.ubuntu.com/ubuntu" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
        sudo sed -i 's#http://azure\.archive\.ubuntu\.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list || true
        sudo apt-get update $APT_OPTS
        sudo apt-get install -y $APT_OPTS cmake ninja-build g++-11 libgtest-dev opencl-headers ocl-icd-opencl-dev
        mkdir -p "$RUNNER_TEMP/cuda-stub/include"
        cat > "$RUNNER_TEMP/cuda-stub/include/cuda_runtime.h" <<'EOF'
        #pragma once
        #include <stddef.h>

        typedef enum cudaError {
            cudaSuccess = 0,
            cudaErrorInvalidValue = 1,
            cudaErrorMemoryAllocation = 2,
            cudaErrorInitializationError = 3,
            cudaErrorPeerAccessAlreadyEnabled = 217
        } cudaError_t;

        typedef void* cudaStream_t;

        typedef struct cudaDeviceProp {
            char name[256];
            int major;
            int minor;
            int maxThreadsPerBlock;
            int maxGridSize[3];
        } cudaDeviceProp;

        typedef enum cudaMemcpyKind {
            cudaMemcpyHostToDevice = 1,
            cudaMemcpyDeviceToHost = 2,
            cudaMemcpyDeviceToDevice = 3
        } cudaMemcpyKind;

        enum { cudaMemAttachGlobal = 1 };
        enum { cudaCpuDeviceId = -1 };
        EOF
        echo "CUDA_STUB_INCLUDE=$RUNNER_TEMP/cuda-stub/include" >> "$GITHUB_ENV"

    - name: 配置 CMake (GPU headers)
      run: |
        cmake -B build-gpu-headers -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_COMPILER=g++-11 \
          -DKAIRO_ENABLE_GPU=ON \
          -DKAIRO_ENABLE_CUDA=ON \
          -DKAIRO_ENABLE_OPENCL=ON \
          -DKAIRO_BUILD_TESTS=ON \
          -DKAIRO_BUILD_EXAMPLES=OFF \
          -DCUDA_FOUND=TRUE \
          -DCUDA_VERSION=0.0 \
          -DCUDA_INCLUDE_DIRS="$CUDA_STUB_INCLUDE"

    - name: 编译 GPU 头文件路径
      run: cmake --build build-gpu-headers --config Release -j

    - name: 运行无硬件 GPU 测试
      working-directory: build-gpu-headers
      # test_opencl_lifecycle 使用注入 loader 的假 OpenCL 函数表，可在无硬件
      # 环境完整运行（含 worker 自停回归用例）。
      run: ctest -C Release --output-on-failure --verbose -R '^(test_cuda_executor|test_opencl_executor|test_opencl_lifecycle|test_executor_manager_gpu)$'

  # 可选：代码覆盖率任务
  coverage:
    if: github.event_name != 'schedule'
    name: Code Coverage
    runs-on: ubuntu-22.04
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装依赖
      run: |
        # 同上：固定镜像为 archive.ubuntu.com，并限制 apt 超时与重试。
        APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
        # azure 主镜像被黑洞时，apt mirror 方法的探测重试不受上面的 Acquire 选项约束，
        # 直接固定镜像列表为 archive.ubuntu.com，跳过对 azure 镜像的探测。
        echo "https://archive.ubuntu.com/ubuntu" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
        sudo sed -i 's#http://azure\.archive\.ubuntu\.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list || true
        sudo apt-get update $APT_OPTS
        sudo apt-get install -y $APT_OPTS cmake ninja-build g++-11 lcov libgtest-dev
        cd /usr/src/gtest
        sudo cmake .
        sudo make
        sudo cp lib/*.a /usr/lib

    - name: 配置 CMake (启用覆盖率)
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_COMPILER=g++-11 \
          -DKAIRO_BUILD_TESTS=ON \
          -DKAIRO_ENABLE_COVERAGE=ON

    - name: 编译
      run: cmake --build build -j

    - name: 运行测试
      working-directory: build
      env:
        # Code Coverage build 在 2 vCPU runner 上,mlockall(MCL_CURRENT|MCL_FUTURE)
        # 会触发 OOM-killer。test_realtime_hardening 尊重这个 env 跳过 mlock 调用。
        # 覆盖率插桩会显著放大 benchmark/stress 用例耗时；覆盖率任务只收集
        # 功能测试覆盖率，性能基准由非 coverage benchmark 运行负责。
        KAIRO_TEST_NO_MLOCKALL: 1
      run: ctest --output-on-failure -E '^(benchmark_|test_(performance|stress)$)'

    - name: 生成覆盖率报告
      run: |
        cd build
        lcov --capture --directory . --output-file coverage.info
        lcov --remove coverage.info '/usr/*' '*/tests/*' '*/examples/*' --output-file coverage.info
        lcov --list coverage.info

    - name: 上传到 Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./build/coverage.info
        flags: unittests
        name: codecov-kairo
